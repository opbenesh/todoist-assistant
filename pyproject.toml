[project]
name = "assistant"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = [
    "python-telegram-bot[job-queue]>=21.0",
    "anthropic>=0.40.0",
    "todoist-api-python>=3.0.0",
    "python-dotenv>=1.0.0",
    "tzdata>=2024.1",
    "requests>=2.32.0",
]

[dependency-groups]
dev = ["pytest", "pytest-asyncio", "ruff", "ty"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
asyncio_mode = "auto"

[tool.ruff]
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I"]
